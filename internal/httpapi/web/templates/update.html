{{define "update_dialog"}}
<dialog id="project-update" aria-labelledby="update-title" data-csrf="{{.CSRF}}" data-owner="{{eq .User.Role "owner"}}">
 <header class="panel-head"><h2 id="update-title" data-admin-i18n>项目更新</h2><button type="button" class="btn sm ghost" data-update-close autofocus data-admin-i18n>关闭</button></header>
 <div class="panel-body">
  <p><span data-admin-i18n>当前版本</span> <strong>{{.Version}}</strong><span data-update-target></span></p>
  <p data-update-status role="status" aria-live="polite"></p>
  <section data-update-changes hidden><h3 data-admin-i18n>更新内容</h3><pre data-update-notes></pre><a target="_blank" rel="noopener noreferrer" data-release-link data-admin-i18n>在 GitHub 查看此版本</a></section>
  {{if eq .User.Role "owner"}}<details data-update-config><summary data-admin-i18n>更新仓库</summary>
    <form data-update-bind><label><span data-admin-i18n>可信 GitHub 仓库地址</span><input type="url" name="repository" required placeholder="https://github.com/yiluoiro/card-word"></label>
    <p class="hint" data-admin-i18n>只绑定你信任的仓库。安装更新会在本机运行该仓库发布的程序。</p><button class="btn sm" type="submit" data-admin-i18n>保存仓库</button></form>
  </details>{{end}}
  <div class="actions"><button type="button" class="btn" data-update-check data-admin-i18n>检查更新</button>{{if eq .User.Role "owner"}}<button type="button" class="btn primary" data-update-action hidden></button>{{end}}</div>
 </div>
</dialog>
{{end}}
