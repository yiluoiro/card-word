{{define "product_variants_admin"}}<section class="panel"><div class="panel-head"><h3 data-admin-i18n><span data-admin-i18n>商品规格</span></h3><a class="btn sm" href="/admin/products/{{.Product.ID}}/cards"><span data-admin-i18n>管理规格库存</span></a></div><div class="panel-body">
<p class="hint"><span data-admin-i18n>每个规格独立定价和发货。首次添加时，未售出的默认库存归入第一个规格；有待付款或待补发订单时需先处理。设置规格后，商品基础价格不参与结算。</span></p>
{{range .Variants}}<form method="post" action="/admin/products/{{$.Product.ID}}/variants" class="form variant-row"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="variant_id" value="{{.ID}}"><fieldset class="readonly-fields" {{if not $.CanManage}}disabled{{end}}><div class="row"><label><span data-admin-i18n>规格名称</span><input name="name" value="{{.Name}}" maxlength="80" required></label><label>价格<input name="price" value="{{moneyShort .PriceCents}}" required inputmode="decimal"></label><label>排序<input type="number" name="sort" value="{{.Sort}}"></label></div><div class="actions"><label class="checkbox"><input type="checkbox" name="active" value="1" {{if .Active}}checked{{end}}><span data-admin-i18n>在售</span></label><span class="badge">库存 {{.Stock}}</span><button class="btn sm"><span data-admin-i18n>保存规格</span></button><button class="btn sm danger" name="action" value="delete" formnovalidate data-confirm="删除此规格？有库存或订单的规格只能停用。">删除</button></div></fieldset></form>{{end}}
{{if .CanManage}}<details><summary><span data-admin-i18n>添加规格</span></summary><form method="post" action="/admin/products/{{.Product.ID}}/variants" class="form"><input type="hidden" name="csrf" value="{{.CSRF}}"><div class="row"><label><span data-admin-i18n>规格名称</span><input name="name" placeholder="例如：月卡 / 年卡" maxlength="80" required></label><label>价格<input name="price" inputmode="decimal" required></label><label>排序<input name="sort" type="number" value="0"></label></div><label class="checkbox"><input type="checkbox" name="active" value="1" checked><span data-admin-i18n>在售</span></label><button class="btn primary"><span data-admin-i18n>添加规格</span></button></form></details>{{end}}
</div></section>{{end}}
