{{define "admin_login_2fa"}}{{template "head" .}}
<body class="auth admin-auth auth-single"><div class="auth-language">{{template "admin_language" .}}</div>
<main class="auth-card">
  <div class="auth-brand">
    <span class="brand-mark">{{template "i_shield" .}}</span>
    <div>
      <h1><span data-admin-i18n>两步验证</span></h1>
      <div class="sub"><span data-admin-i18n>输入认证器中的 6 位动态码</span></div>
    </div>
  </div>
  {{if .Error}}<div class="alert err">{{template "i_alert" .}}<div data-admin-i18n>{{.Error}}</div></div>{{end}}
  <form method="post" action="/admin/login/2fa" class="form">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label><span data-admin-i18n>动态码或恢复码</span>
      <input type="text" name="code" inputmode="text" autocomplete="one-time-code" placeholder="123456" required autofocus>
      <span class="hint"><span data-admin-i18n>丢失设备时可使用启用时保存的一次性恢复码</span></span>
    </label>
    <button class="btn primary block lg" type="submit">{{template "i_lock" .}} <span data-admin-i18n>验证并登录</span></button>
  </form>
  <div class="auth-foot">{{template "i_shield" .}} <span data-admin-i18n>验证码 5 分钟内有效，最多尝试 5 次。</span></div>
</main>
</body>
</html>{{end}}
