services:
  cardword:
    build:
      context: .
      args:
        VERSION: "v1.0.0"
    image: cardword-community:v1.0.0
    restart: unless-stopped
    stop_grace_period: 35s
    ports:
      - "8080:8080"
    environment:
      # 必须改成你的公网地址，支付回调与同源校验都依赖它
      CARDWORD_BASE_URL: "http://127.0.0.1:8080"
      CARDWORD_ENV: "production"
      CARDWORD_LOG_LEVEL: "info"
      # 通过 /install 与 /data/install-token.txt 初始化管理员
      # 可选：显式指定主密钥（base64/hex 32 字节），不设置则自动生成到 /data/master.key
      # CARDWORD_MASTER_KEY: ""
      # 可选：强制插件签名并信任公钥
      # CARDWORD_PLUGIN_REQUIRE_SIGNATURE: "1"
      # CARDWORD_PLUGIN_PUBLIC_KEYS: "base64-public-key"
      CARDWORD_MARKET_URL: "https://zinvmeng.com/market/index.json"
    volumes:
      - cardword-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: false

volumes:
  cardword-data:
